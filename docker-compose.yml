services:
  postgres:
    image: postgres:16-alpine
    container_name: wealthos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wealthos
      POSTGRES_PASSWORD: wealthos
      POSTGRES_DB: wealthos
    ports:
      - "5432:5432"
    volumes:
      - wealthos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthos -d wealthos"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wealthos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - wealthos-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wealthos-pgdata:
  wealthos-redisdata:
